<!DOCTYPE html>
<html>
<head>
<title>Stock List - Aditi Sales</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }
    table {
        border-collapse: collapse;
        width: 80%; /* Increased width slightly for two icons */
        max-width: 800px;
        margin: auto;
        background: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }
    th {
        background: #333;
        color: white;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    #searchBox {
        display: block;
        margin: 20px auto;
        padding: 10px;
        width: 300px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #updateTime {
        text-align: center;
        margin-bottom: 15px;
        color: gray;
        font-size: 14px;
    }
    /* Container for the two logos */
    .link-container {
        display: flex;
        justify-content: center;
        gap: 25px;
    }
    .store-logo {
        width: 28px;
        height: 28px;
        cursor: pointer;
        transition: transform 0.2s;
        display: inline-block;
    }
    .store-logo:hover {
        transform: scale(1.2);
    }
</style>
</head>
<body>

<h1>Available Stock</h1>
<div id="updateTime">
    Last Updated: <span id="time"></span>
</div>

<input type="text" id="searchBox" placeholder="Search product..." onkeyup="searchProduct()">

<table id="stockTable">
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Available Qty</th>
            <th>MOP</th>
            <th>Check Price</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const DATA_URL = "https://raw.githubusercontent.com/amitkumar02177-debug/aditisales/main/stock_web1/stocks.json";

// Inline SVG logos
const AMAZON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28">
  <rect width="100" height="100" rx="10" fill="#FF9900"/>
  <text x="50" y="62" font-size="52" font-family="Arial Black" font-weight="900" fill="white" text-anchor="middle">a</text>
</svg>`;

const FLIPKART_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28">
  <rect width="100" height="100" rx="10" fill="#2874F0"/>
  <text x="50" y="68" font-size="52" font-family="Arial Black" font-weight="900" fill="#FFE500" text-anchor="middle">F</text>
</svg>`;

function cleanProductName(name) {
    return name
        .replace(/\s*\(M\/V\)|\s*\(M\)|\s*\(V\)/g, "") // Remove suffixes
        .replace(/\//g, " ")                           // Convert "/" to space
        .trim();
}

function getLinks(productName) {
    const clean = cleanProductName(productName);
    const encoded = encodeURIComponent(clean);

    const amazon = `<a class="store-logo" href="https://www.amazon.in/s?k=${encoded}" target="_blank" title="Search on Amazon">${AMAZON_SVG}</a>`;
    const flipkart = `<a class="store-logo" href="https://www.flipkart.com/search?q=${encoded}" target="_blank" title="Search on Flipkart">${FLIPKART_SVG}</a>`;

    return `<div class="link-container">${amazon}${flipkart}</div>`;
}

async function loadStocks(){
    try {
        let response = await fetch(DATA_URL + "?t=" + Date.now(), {
            cache: "no-store"
        });
        let data = await response.json();
        let table = document.querySelector("#stockTable tbody");
        table.innerHTML = "";
        
        data.forEach(item => {
            let row = `
            <tr>
                <td>${item.name}</td>
                <td>${item.qty}</td>
                <td>${item.mop || ""}</td>
                <td>${getLinks(item.name)}</td>
            </tr>`;
            table.innerHTML += row;
        });
        document.getElementById("time").innerText = new Date().toLocaleString();
    } catch (error) {
        console.error("Error loading stock data:", error);
    }
}

function searchProduct(){
    let input = document.getElementById("searchBox").value.toLowerCase();
    let rows = document.querySelectorAll("#stockTable tbody tr");
    rows.forEach(row => {
        let product = row.children[0].textContent.toLowerCase();
        row.style.display = product.includes(input) ? "" : "none";
    });
}

// Initial load
loadStocks();
// Refresh every 5 minutes
setInterval(loadStocks, 300000);
</script>

</body>
</html>
