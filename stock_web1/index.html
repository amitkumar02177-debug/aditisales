<!DOCTYPE html>
<html>
<head>
<title>Stock List</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
body{
font-family: Arial;
background:#f5f5f5;
}
table{
border-collapse: collapse;
width: 60%;
margin:auto;
background:white;
}
th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}
th{
background:#333;
color:white;
}
h1{
text-align:center;
}
#searchBox{
display:block;
margin:20px auto;
padding:8px;
width:300px;
font-size:16px;
}
#updateTime{
text-align:center;
margin-bottom:15px;
color:gray;
}
.store-logo{
width:28px;
height:28px;
cursor:pointer;
transition: transform 0.2s;
display:inline-block;
}
.store-logo:hover{
transform: scale(1.2);
}
</style>
</head>
<body>
<h1>Available Stock</h1>
<div id="updateTime">
Last Updated: <span id="time"></span>
</div>
<input type="text" id="searchBox" placeholder="Search product..." onkeyup="searchProduct()">
<table id="stockTable">
<thead>
<tr>
<th>Product Name</th>
<th>Available Qty</th>
<th>MOP</th>
<th>View</th>
</tr>
</thead>
<tbody></tbody>
</table>
<script>
const DATA_URL =
"https://raw.githubusercontent.com/amitkumar02177-debug/aditisales/main/stock_web1/stocks.json";

const AMAZON_BRANDS = ["REDMI", "XIAOMI", "IQOO", "ONEPLUS"];

// Inline SVG logos — no external requests, loads instantly
const AMAZON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28">
  <rect width="100" height="100" rx="10" fill="#FF9900"/>
  <text x="50" y="62" font-size="52" font-family="Arial Black" font-weight="900"
    fill="white" text-anchor="middle">a</text>
</svg>`;

const FLIPKART_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28">
  <rect width="100" height="100" rx="10" fill="#2874F0"/>
  <text x="50" y="68" font-size="52" font-family="Arial Black" font-weight="900"
    fill="#FFE500" text-anchor="middle">F</text>
</svg>`;

function cleanProductName(name) {
    return name.replace(/\s*\(M\/V\)|\s*\(M\)|\s*\(V\)/g, "").trim();
}

function getLink(productName) {
    const clean    = cleanProductName(productName);
    const encoded  = encodeURIComponent(clean);
    const firstWord = clean.trim().split(" ")[0].toUpperCase();

    if (AMAZON_BRANDS.includes(firstWord)) {
        return `<a class="store-logo" href="https://www.amazon.in/s?k=${encoded}" target="_blank" title="Search on Amazon">${AMAZON_SVG}</a>`;
    } else {
        return `<a class="store-logo" href="https://www.flipkart.com/search?q=${encoded}" target="_blank" title="Search on Flipkart">${FLIPKART_SVG}</a>`;
    }
}

async function loadStocks(){
let response = await fetch(DATA_URL + "?t=" + Date.now(), {
    cache: "no-store"
});
let data = await response.json();
let table = document.querySelector("#stockTable tbody");
table.innerHTML="";
data.forEach(item=>{
let row=`
<tr>
<td>${item.name}</td>
<td>${item.qty}</td>
<td>${item.mop || ""}</td>
<td>${getLink(item.name)}</td>
</tr>
`;
table.innerHTML+=row;
});
document.getElementById("time").innerText =
new Date().toLocaleString();
}
function searchProduct(){
let input = document.getElementById("searchBox").value.toLowerCase();
let rows = document.querySelectorAll("#stockTable tbody tr");
rows.forEach(row=>{
let product=row.children[0].textContent.toLowerCase();
row.style.display = product.includes(input) ? "" : "none";
});
}
loadStocks();
setInterval(loadStocks,300000);
</script>
<script src="scripts.js"></script>
</body>
</html>
